<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma Sói Tổng Đài</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: gấp gáp vui như ca trực đêm, chữ to rõ để chiếu máy chiếu và bấm trên điện thoại
   IDEA: bảng điều phối ca trực tổng đài + lá bài vai trò trên điện thoại
   PICTURE: màn hình MC = bảng ca trực (QR, đồng hồ, ghế); điện thoại = thẻ nhiệm vụ
   COLOUR and TYPE: đỏ Toshiba chủ đạo, mực than, xanh điện nhấn; Be Vietnam Pro
   LAYOUT: dải đỏ trên cùng, nội dung một cột, ghế tự xuống dòng; điện thoại một cột */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121216);--ink:light-dark(#18181d,#f1f1f4);--mute:light-dark(#5d5d68,#a9a9b6);--red:#d4001a;--red2:light-dark(#ffe9eb,#3a1015);--blue:light-dark(#1f5cff,#7ea2ff);--card:light-dark(#f5f5f7,#1d1d23);--line:light-dark(#e2e2e8,#2e2e37);--ok:light-dark(#0a7a3d,#5fd497)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.12;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:18px}
.top{background:var(--red);color:#fff;padding:18px max(5vw,16px) 0}
.top .row{justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tabs button{background:transparent;color:#fff;border:0;border-radius:10px 10px 0 0;padding:12px 18px;font:600 16px/1.2 "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--bg);color:var(--ink)}
.band{padding:clamp(18px,3vw,36px) max(5vw,16px);max-width:1240px;margin:0 auto}
.hide{display:none!important}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.g2b{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.g2,.g2b{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea,select{font:16px/1.3 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:110px;resize:vertical}
input[type=radio],input[type=checkbox]{width:auto;min-height:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{font:600 16px/1.2 "Be Vietnam Pro",system-ui,sans-serif;border:0;border-radius:12px;padding:11px 18px;min-height:44px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);color:#fff}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-size:14px;color:var(--mute)}
.warn{color:var(--red);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.cols3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:600px){.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{display:flex;gap:10px;flex-wrap:wrap}
.mode label{margin:0;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
pre{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
/* MC */
.qr{background:#fff;padding:10px;border-radius:14px;width:100%;max-width:300px}.qr svg{display:block;width:100%;height:auto}
.code{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:.08em;line-height:1}
.url{font-size:13px;overflow-wrap:anywhere;color:var(--mute)}
.head{font-size:clamp(22px,3vw,32px);font-weight:800;line-height:1.2}
.timer{font-weight:800;font-size:clamp(40px,6vw,64px);font-variant-numeric:tabular-nums;line-height:1}
.ph{display:inline-block;font-weight:700;font-size:14px;padding:4px 12px;border-radius:99px;background:var(--ink);color:var(--bg)}
.ph.n{background:#1b1b33;color:#fff}.ph.d{background:#f2b400;color:#111}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.seat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:grid;gap:4px}
.seat.out{opacity:.45;background:transparent}
.seat b{font-size:18px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.tag.bad{background:var(--red2);color:var(--red)}
.log{margin:0;padding-left:20px;max-height:300px;overflow:auto}.log li{margin:4px 0}
table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td.r,th.r{text-align:right;white-space:nowrap}
.rules h3{margin-top:22px}.rules p,.rules li{max-width:74ch}.rules ol,.rules ul{padding-left:22px}.rules li{margin:6px 0}
.rl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin:8px 0}
.rl svg{width:40px;height:40px}
.bi{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}.bi button{justify-self:start}#blist{max-height:560px;overflow:auto}
/* điện thoại */
.pv{max-width:480px;margin:0 auto;padding:16px;display:grid;gap:14px}
.ptop{background:var(--red);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ptop b{font-size:18px}
.role{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.role svg{width:64px;height:64px}
.opts{display:grid;gap:8px}
.opt{font:600 16px/1.35 "Be Vietnam Pro",system-ui,sans-serif;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer}
.opt.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--bg))}
.q{font-size:18px;font-weight:600;margin:4px 0 10px}
.lbl{font-weight:700;margin:16px 0 8px}
.cd{font-weight:800;font-variant-numeric:tabular-nums}
.msgs{margin:0;padding-left:18px}.msgs li{margin:6px 0}
.big{font-size:20px;font-weight:700}
.ov{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.55);display:grid;place-items:center;padding:16px;overflow:auto}
.ovc{background:var(--bg);color:var(--ink);border-radius:20px;max-width:440px;width:100%;padding:22px 20px;display:grid;gap:10px;border-top:8px solid var(--blue)}
.ovc.t-n{border-top-color:#f2a900}.ovc.t-bad{border-top-color:var(--red)}.ovc.t-ok{border-top-color:#0a7a3d}
.ovc h2{margin:0;font-size:24px}.ovc .lead{font-size:19px;font-weight:700;margin:0}.ovc p{margin:0}
.ovi{width:56px;height:56px}.priv{background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:12px;padding:10px 12px}
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr) 2.2em;gap:8px;align-items:center}.bar i{display:block;height:14px;border-radius:7px;background:var(--blue)}.bar.hi i{background:var(--red)}.bar b{text-align:right;font-variant-numeric:tabular-nums}
.ann{border:3px solid #f2a900}.ann.t-bad{border-color:var(--red)}.ann.t-ok{border-color:#0a7a3d}.ann .lead{font-size:26px;font-weight:800;line-height:1.3;margin:6px 0}.ann p{font-size:19px;margin:6px 0}
.todo{border-left:5px solid #f2a900;padding:8px 12px;background:color-mix(in srgb,#f2a900 12%,transparent);border-radius:8px;margin:10px 0 0}
.dl{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--red2);color:var(--red);margin-left:6px}
@media(prefers-reduced-motion:no-preference){.ovc{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>
</head>

<div id="app"></div>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;

function LocalBE(){
  const bc=('BroadcastChannel' in window)?new BroadcastChannel('msTD'):null,subs=new Set(),K=p=>'msTDdb:'+p;
  const emit=()=>setTimeout(()=>subs.forEach(f=>f()));
  if(bc)bc.onmessage=emit;addEventListener('storage',e=>{if(e.key&&e.key.startsWith('msTDdb:'))emit()});
  return{
    async set(path,data){LS.set(K(path),deepMerge(LS.get(K(path),{}),clean(data)));if(bc)bc.postMessage(1);emit()},
    watch(path,cb){const f=()=>cb(LS.get(K(path),null));subs.add(f);setTimeout(f)},
    watchCol(path,cb){const pre=K(path+'/');const f=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(pre)&&!k.slice(pre.length).includes('/'))o[k.slice(pre.length)]=LS.get(k,null)}cb(o)};subs.add(f);setTimeout(f)}
  };
}
async function FireBE(cfg){
  const V='10.12.2';
  if(!window.firebase){await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  const app=firebase.apps.length?firebase.app():firebase.initializeApp({apiKey:cfg.a,projectId:cfg.p,authDomain:cfg.p+'.firebaseapp.com'});
  const db=firebase.firestore(app);
  return{
    set:(path,data)=>db.doc(path).set(clean(data),{merge:true}),
    watch:(path,cb)=>db.doc(path).onSnapshot(d=>cb(d.exists?d.data():null),e=>showErr(e)),
    watchCol:(path,cb)=>db.collection(path).onSnapshot(s=>{const o={};s.forEach(d=>o[d.id]=d.data());cb(o)},e=>showErr(e))
  };
}
function showErr(e){const d=document.createElement('div');d.className='card warn';d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9';d.textContent='Lỗi kết nối: '+(e&&e.message||e);document.body.appendChild(d);setTimeout(()=>d.remove(),8000)}

const nk=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const wordSet=s=>new Set(nk(s).split(' ').filter(w=>w.length>1));
const jac=(a,b)=>{const A=wordSet(a),B=wordSet(b);let i=0;A.forEach(w=>{if(B.has(w))i++});const u=A.size+B.size-i;return u?i/u:0};
function parseLines(t){
  const items=[],bad=[];
  String(t).split('\n').forEach(l=>{
    l=l.trim();if(!l||l.startsWith('#'))return;
    const p=l.split('|').map(x=>x.trim()).filter(Boolean);let g='',s='';const o=[];
    p.forEach((x,i)=>{if(i>1&&/^g:/i.test(x))g=x.slice(2).trim();else if(i>1&&/^s:/i.test(x))s=x.slice(2).trim();else o.push(x)});
    if(o.length<3){bad.push(l);return}
    const a=o[1],w=o.slice(2,5),opts=[a,...w];
    if(new Set(opts.map(nk)).size<opts.length){bad.push(l);return}
    items.push({q:o[0],a,w,g:g||'Khác',s})
  });
  return{items,bad}
}
const isDup=(a,b)=>nk(a.q)===nk(b.q)||jac(a.q,b.q)>=.8;
function addItems(bank,items){const added=[],dups=[];for(const it of items){const hit=bank.find(b=>isDup(b,it));if(hit)dups.push({it,hit});else{bank.push(it);added.push(it)}}return{added,dups}}
function findDups(bank){const out=[];for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++)if(isDup(bank[i],bank[j]))out.push([i,j]);return out}
const toText=b=>b.map(x=>[x.q,x.a,...x.w,'g:'+x.g,...(x.s?['s:'+x.s]:[])].join(' | ')).join('\n');
function getBank(){
  let b=LS.get('msTD_bank3',null);if(Array.isArray(b))return b;
  b=[];addItems(b,parseLines(GENERAL).items);addItems(b,parseLines(WASHER).items);
  const old=LS.get('msTD_bank2',null);if(typeof old==='string')addItems(b,parseLines(old).items);
  LS.set('msTD_bank3',b);return b
}
const setBank=b=>LS.set('msTD_bank3',b);

  }
  view.addEventListener('click',async e=>{

    if(b.id==='ovok'){seenAnn=R.ann.id;st.set(ak,seenAnn);render();return}
    if(b.dataset.t!==undefined){sel.target=b.dataset.t;render();return}
    if(b.dataset.q!==undefined){sel.ans[+b.dataset.q]=+b.dataset.a;render();return}
    if(b.id==='sb'){const s=ME.priv.step,qs=s.qs||(s.q?[s.q]:[]);
      if(s.targets&&!sel.target){$('#se').textContent='Hãy chọn 1 người.';return}
      if(qs.some((_,i)=>sel.ans[i]===undefined)){$('#se').textContent='Hãy trả lời câu hỏi.';return}

      try{await BE.set(pp,{act:{key:s.key,target:sel.target||'',ans:qs.length>1?sel.ans:(qs.length?sel.ans[0]:-1),t:Date.now()}})}catch(err){showErr(err)}

    else if(R.phase==='end')ctl=`<button class="btn red" data-a="again">Ván tiếp theo (cộng dồn điểm)</button> <button class="btn ghost" data-a="reset">Xoá tổng điểm, bắt đầu buổi mới</button>`;
    const seats=ids.map(p=>{const out=!lobby&&!R.alive[p],ro=lobby?'':(R.phase==='end'?R.reveal[p]:roleOf(p)),sent=k&&P[p]&&P[p].act&&P[p].act.key===k;
      return`<div class="seat ${out?'out':''}"><b>${esc(nm(p))}</b><span class="small">${lobby?'Đã vào phòng':out?'Rời ca':'Trong ca'}${!lobby?' · '+(R.kpi[p]||0)+' KPI':''}${R.phaoUsed&&R.phaoUsed[p]?' · đã dùng phao':''}</span>${ro&&(showRoles||R.phase==='end')?`<span><span class="tag ${ro==='wolf'?'bad':''}">${ROLE[ro].n}</span></span>`:''}${k&&!out?`<span class="${sent?'okc':'small'}">${sent?'✓ Đã gửi':'… đang làm'}</span>`:''}${lobby?`<button class="btn ghost" data-kick="${p}" style="min-height:36px;padding:6px 10px">Bỏ khỏi phòng</button>`:''}</div>`}).join('');
    const stats=Object.values(H.stats).filter(s=>s.n).sort((a,b)=>a.c/a.n-b.c/b.n).slice(0,8);
    $('#t-room').innerHTML=`<div class="g2b">
      <div class="card"><div class="qr">${qrSvg()}</div><p style="margin:10px 0 4px"><b>Quét để vào phòng ${esc(code.toUpperCase())}</b></p><p class="url">${esc(link)}</p>
        <div class="row"><button class="btn ghost" data-a="copy">Sao chép link</button>${S.mode==='L'?'<button class="btn ghost" data-a="tab">Mở tab người chơi thử</button>':''}</div><p class="small" id="cp"></p>
        <button class="btn ghost" data-a="close" style="margin-top:10px">Đóng phòng</button></div>
      <div style="display:grid;gap:18px">
        ${R.ann&&!lobby&&R.phase!=='night'&&R.phase!=='vote'?`<div class="card ann t-${R.ann.tone}">${annHTML(R.ann,true)}</div>`:''}
        <div class="card"><span class="ph ${R.phase==='night'?'n':'d'}">${phaseName(R)}</span>${R.lastDay&&!lobby&&R.phase!=='end'?`<span class="dl">Hạn chót: hết Ngày ${R.lastDay}</span>`:''}<div class="row" style="justify-content:space-between;margin:12px 0"><div class="head">${esc(R.headline)}</div>${R.deadline?`<div class="timer cd" data-d="${R.deadline}"></div>`:''}</div>${ctl}</div>
        ${R.phase==='end'?endHTML(R):lobby?tallyHTML(R)+(R.tally?'<button class="btn ghost" data-a="reset" style="justify-self:start">Xoá tổng điểm, bắt đầu buổi mới</button>':''):''}
        <div><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Ca trực</h2>${!lobby&&R.phase!=='end'?`<button class="btn ghost" data-a="eye">${showRoles?'Che vai':'Hiện vai (đừng chiếu lên màn hình!)'}</button>`:''}</div><div class="seats">${seats||'<p class="small">Chưa có ai. Mời mọi người quét mã QR.</p>'}</div></div>
        <div class="g2"><div class="card"><h3>Bảng tin</h3><ol class="log">${(R.news||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ol></div>
        <div class="card"><h3>Câu hỏi khó nhất (tỉ lệ đúng)</h3>${stats.length?`<table><tbody>${stats.map(s=>`<tr><td>${esc(s.q)}</td><td class="r">${Math.round(100*s.c/s.n)}% (${s.c}/${s.n})</td></tr>`).join('')}</tbody></table>`:'<p class="small">Sẽ hiện sau đêm đầu tiên. Dùng để biết nội dung nào cần training lại.</p>'}</div></div>
      </div></div>`;
    tick();
  }
  $('#t-room').addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.kick){await BE.set(pp(b.dataset.kick),{kicked:true});return}
    const a=b.dataset.a;
    if(a==='deal')run(deal);else if(a==='night')run(startNight);else if(a==='endnight')run(resolveNight);
    else if(a==='vote')run(openVote);else if(a==='endvote')run(resolveVote);else if(a==='endphao')run(resolvePhao);
    else if(a==='again')run(newGame);
    else if(a==='reset'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Bấm lần nữa để xoá tổng điểm';return}LS.del('msTD_tally_'+code);R.tally=null;await BE.set(rp(),{tally:null});render()}
    else if(a==='plus'){R.deadline=Math.max(R.deadline,Date.now())+60000;await BE.set(rp(),{deadline:R.deadline});render()}
    else if(a==='eye'){showRoles=!showRoles;render()}
    else if(a==='copy'){try{await navigator.clipboard.writeText(link);$('#cp').textContent='Đã sao chép'}catch(err){$('#cp').textContent='Hãy chọn link và sao chép thủ công'}}
    else if(a==='tab'){window.open(link,'_blank')}
    else if(a==='close'){if(b.dataset.sure){LS.del('msTD_mc');location.reload()}else{b.dataset.sure=1;b.textContent='Bấm lần nữa để đóng phòng'}}
  });
}

function RULES(){return`
<h2>Luật chơi Ma Sói Tổng Đài (bản điện thoại)</h2>
<p>Cả phòng là một <b>ca trực tổng đài</b>. Ẩn trong ca là <b>Mã Lỗi</b> muốn đánh sập ca trực. Không ai phải nhắm mắt: mọi lựa chọn bí mật đều bấm trên điện thoại của mình. <b>Điểm mới:</b> mỗi đêm ai cũng phải trả lời 1 câu hỏi nghiệp vụ, và <b>kỹ năng chỉ có hiệu lực khi trả lời đúng</b>. Ai giỏi nghiệp vụ thì phe đó mạnh.</p>
<h3>Ván chuẩn 5 người</h3>
<p>1 Mã Lỗi, 1 Giám sát QA, 1 Kỹ thuật viên, 2 Tổng đài viên. <b>Hạn chót: hết Ngày 2.</b> MC không chơi, chỉ điều khiển màn hình máy tính (có thể chiếu lên máy chiếu). Bộ vai và hạn chót được công bố trước, chỉ không biết ai giữ vai nào.</p>
${['wolf','seer','guard','villager'].map(k=>`<div class="rl">${svg(k)}<div><b>${ROLE[k].n}</b> <span class="small">· ${ROLE[k].team}</span><div>${ROLE[k].p}</div><div class="small">${ROLE[k].g}</div></div></div>`).join('')}
<h3>Cách chơi</h3>
<ol>
<li><b>Vào phòng:</b> MC tạo phòng, mọi người quét QR và nhập tên. MC bấm "Chia vai". Vai tự hiện trên điện thoại, đọc xong bấm "Úp vai".</li>
<li><b>Đêm (60 giây):</b> tất cả cùng lúc làm trên điện thoại: chọn 1 người theo vai và trả lời 1 câu hỏi trắc nghiệm. Ai cũng thao tác giống nhau nên không đoán được vai qua việc ai đang bấm.</li>
<li><b>Trời sáng, thông báo kết quả:</b> mọi điện thoại và màn hình MC cùng hiện bảng kết quả đêm: ai rời ca (lộ vai), hay Kỹ thuật viên đã cứu được người, hay Mã Lỗi trả lời sai nên đêm bình yên; số câu cả ca trả lời đúng; có manh mối được phát hay không; còn mấy ngày đến hạn chót. Tin riêng (kết quả soi, manh mối, đáp án đúng) hiện ngay dưới bảng trên điện thoại của từng người.</li>
<li><b>Ngày, thảo luận (3 phút):</b> nói chuyện công khai, có thể kể manh mối hoặc nói dối. Điện thoại có dòng "Việc của bạn" gợi ý nên làm gì theo vai. Không đưa điện thoại cho người khác xem.</li>
<li><b>Bỏ phiếu bí mật (60 giây):</b> người nhiều phiếu nhất (không hoà và nhiều hơn số phiếu bỏ qua) bị đưa ra xử lý. Bảng kết quả phiếu hiện lên cho cả phòng.</li>
<li><b>Phao nghiệp vụ:</b> người bị bầu trả lời 2 câu. Đúng cả 2 thì ở lại ca (vai vẫn bí mật); sai 1 câu là rời ca và lộ vai. Mỗi người chỉ có 1 lần phao.</li>
<li><b>Ngụy trang của Mã Lỗi:</b> mỗi Mã Lỗi có 1 lần ngụy trang. Đêm nào Mã Lỗi trả lời đúng mà bị Giám sát QA soi trúng, Giám sát QA sẽ thấy "không phải Mã Lỗi". Mã Lỗi được báo riêng là đã dùng ngụy trang. Lần soi trúng sau sẽ ra kết quả thật.</li>
<li>Lặp lại đêm và ngày đến khi có phe thắng.</li>
</ol>
<h3>Điều kiện thắng</h3>
<ul><li><b>Phe Tổng đài</b> thắng khi loại hết Mã Lỗi trước hạn chót.</li>
<li><b>Phe Mã Lỗi</b> thắng khi: còn ít nhất 1 Mã Lỗi sau khi bỏ phiếu ngày cuối (hạn chót), <b>hoặc</b> số Mã Lỗi bằng số người phe Tổng đài.</li>
<li>Số Mã Lỗi và hạn chót tự động: 4–7 người có 1 Mã Lỗi, hạn chót hết Ngày 2; 8 người có 2 Mã Lỗi, không hạn chót; 9–13 người có 2 Mã Lỗi, hạn chót hết Ngày 6; từ 14 người có 3 Mã Lỗi, không hạn chót. MC có thể tắt hạn chót khi tạo phòng.</li></ul>
<h3>Vì sao chỉnh như vậy (kiểm tra cân bằng)</h3>
<p>Tôi chạy mô phỏng 20.000–40.000 ván cho mỗi cỡ phòng. Mô hình còn thô: người chơi ảo bỏ phiếu ngẫu nhiên trong số người chưa được xác nhận trong sạch và không biết nói dối, nên đây là xu hướng chứ không phải con số chính xác.</p>
<ul>
<li>Luật đầu tiên, 5 người: Mã Lỗi chỉ thắng khoảng 11%, 6 người khoảng 6%, vì phe Tổng đài có quá nhiều thông tin.</li>
<li>Thêm hạn chót và manh mối từ Đêm 2: Mã Lỗi lên khoảng 30% với 5 người.</li>
<li>Thêm Ngụy trang và chỉnh lại số Mã Lỗi theo số người (bản hiện tại): Mã Lỗi thắng khoảng 42% với 5 người, 48–49% với 4, 6 và 8 người, 54% với 7 người, 41–54% với 9–13 người. Ngoài đời Mã Lỗi còn biết nói dối, nên hai phe dự kiến gần ngang nhau.</li>
<li>Hạn chót còn giúp ván ngắn và đều (5 người: tối đa 2 đêm, 2 ngày, khoảng 10–12 phút), nên một buổi training chơi được nhiều ván, mọi người được thử nhiều vai.</li>
<li>Mọi kỹ năng vẫn phụ thuộc vào trả lời đúng: ai giỏi nghiệp vụ thì phe đó mạnh. Người đã rời ca vẫn trả lời câu hỏi để lấy KPI.</li>
</ul>
<h3>Tính điểm cuối ván</h3>
<p>Điểm KPI (mỗi câu đúng +1) + 3 điểm nếu thuộc phe thắng + điểm "nghi đúng" (Tổng đài viên mỗi đêm chọn đúng Mã Lỗi là người mình nghi). Người cao điểm nhất ván được vinh danh, dù thuộc phe nào. <b>Chơi nhiều ván:</b> bấm "Ván tiếp theo (cộng dồn điểm)", điểm các ván tự cộng theo tên người chơi. Cuối buổi, ai tổng điểm cao nhất là <b>TĐV xuất sắc của buổi</b>; bằng điểm thì ai trả lời đúng nhiều câu hơn đứng trên, vẫn bằng thì đồng hạng. Bấm "Xoá tổng điểm" khi sang buổi training khác. Người chơi nên giữ nguyên tên giữa các ván. Màn hình MC có bảng "Câu hỏi khó nhất" để biết nội dung nào cần training lại.</p>
<h3>Điều chỉnh nếu chơi thật thấy lệch</h3>
<ul><li>Mã Lỗi thắng quá nhiều: tăng thời gian thảo luận, hoặc tắt hạn chót cho nhóm mới chơi.</li><li>Phe Tổng đài thắng quá nhiều: giảm thời gian đêm xuống 40 giây, hoặc dùng nhóm câu hỏi khó hơn.</li><li>Ghi lại phe thắng sau mỗi ván; sau khoảng 10 ván sẽ thấy rõ cần chỉnh theo hướng nào.</li></ul>`}
}
